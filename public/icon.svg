<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#borderGrad)" stroke-width="6" stroke-opacity="0.4" fill="none" />

  <!-- Shield / Forge Emblem Backplane -->
  <path d="M256 70 L380 120 V250 C380 340 256 420 256 420 C256 420 132 340 132 250 V120 L256 70 Z" 
        fill="#1E1B4B" fill-opacity="0.5" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Dynamic LF Monogram with Neon Glow -->
  <g filter="url(#glow)">
    <!-- L Shape -->
    <path d="M190 170 V330 H260" stroke="url(#neonGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- F Shape integrated -->
    <path d="M260 170 H330 M260 245 H310" stroke="url(#neonGrad)" stroke-width="28" stroke-linecap="round" />
  </g>

  <!-- Futuristic Tech Dots/Nodes -->
  <circle cx="256" cy="115" r="8" fill="#38BDF8" />
  <circle cx="330" cy="170" r="6" fill="#A855F7" />
  <circle cx="190" cy="330" r="6" fill="#C084FC" />
</svg>
